name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
      AUTO_UPDATE_RELEASE_PUBLISH_ENABLED: ${{ vars.AUTO_UPDATE_RELEASE_PUBLISH_ENABLED }}
      LOCAL_CODE_SIGNING_ENABLED: ${{ vars.LOCAL_CODE_SIGNING_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local app tests
        run: npm run test:local-app

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish signed auto-update release
        if: startsWith(github.ref, 'refs/tags/') && vars.AUTO_UPDATE_RELEASE_PUBLISH_ENABLED == '1' && vars.LOCAL_CODE_SIGNING_ENABLED == '1'
        run: npm run dist:win:publish

      - name: Verify pre-update backup CLI
        run: node --test tests/preUpdateBackupCommand.test.mjs

      - name: Write release readiness receipt
        shell: pwsh
        run: |
          npm run release:check -- --format text | Tee-Object -FilePath "release\release-readiness.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: pharmacy-report-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/release-readiness.txt
          if-no-files-found: error
          retention-days: 30
